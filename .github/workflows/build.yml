name: Build executable (Dev 2.0)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      # Забираем настоящую dev-ветку 2.0 (feature/rc_v_2.0.0.0)
      - name: Checkout Dev 2.0 Branch
        uses: actions/checkout@v5
        with:
          repository: 'k1tbyte/Wand-Enhancer'
          ref: 'feature/rc_v_2.0.0.0'
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      # Собираем монолитный .exe со встроенной веб-панелью 2.0
      - name: Build unsigned executable
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Upload executable
        uses: actions/upload-artifact@v6
        with:
          name: WandEnhancer-v2.0-dev
          path: WandEnhancer/bin/Release/WandEnhancer.exe
          if-no-files-found: error
