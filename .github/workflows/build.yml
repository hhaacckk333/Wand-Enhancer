name: Build executable

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Выберите конфигурацию сборки'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Build executable
        shell: pwsh
        run: ./build.ps1 -Configuration ${{ inputs.configuration }}

      - name: Upload executable and dependencies
        uses: actions/upload-artifact@v6
        with:
          name: WandEnhancer-${{ inputs.configuration }}
          path: WandEnhancer/bin/${{ inputs.configuration }}/*
          if-no-files-found: error
