name: Build executable

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Тег версии для сборки'
        required: true
        default: '2.0.0.0-rc.1'
        type: string

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          repository: 'k1tbyte/Wand-Enhancer'
          ref: ${{ inputs.version_tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Build single-file executable
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Upload executable
        uses: actions/upload-artifact@v6
        with:
          name: WandEnhancer-${{ inputs.version_tag }}
          path: WandEnhancer/bin/Release/WandEnhancer.exe
          if-no-files-found: error
